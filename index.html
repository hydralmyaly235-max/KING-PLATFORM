<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020603">
<title>KING</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000}
body{
  min-height:100vh;display:flex;justify-content:center;
  overflow-x:hidden;font-family:Tahoma,Arial,sans-serif;
}
.page{width:100vw;height:100vh;position:relative;overflow:hidden}
.stage{position:relative;width:100%;height:100%;line-height:0;overflow:hidden}
.stage img{
  display:block;width:100%;height:100%;margin:0;padding:0;
  position:relative;z-index:1;object-fit:cover;object-position:center top;
}

/* تأثيرات فقط فوق الصورة — لا تغيّر الصورة الأصلية */
.effects{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.neon-wash{
  position:absolute;inset:-15%;
  background:
    radial-gradient(ellipse at 50% 34%,rgba(0,255,114,.08),transparent 30%),
    radial-gradient(ellipse at 50% 80%,rgba(0,255,114,.055),transparent 34%);
  animation:wash 6s ease-in-out infinite alternate;
  mix-blend-mode:screen;
}
.scanline{
  position:absolute;left:0;right:0;height:18%;
  background:linear-gradient(to bottom,transparent,rgba(0,255,114,.055),transparent);
  animation:scan 7s linear infinite;
}
.light-sweep{
  position:absolute;top:-25%;left:-35%;width:22%;height:150%;
  background:linear-gradient(90deg,transparent,rgba(100,255,170,.13),transparent);
  transform:rotate(16deg);
  filter:blur(4px);
  animation:sweep 9s ease-in-out infinite;
}
.particles{position:absolute;inset:0}
.p{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#61ff9d;box-shadow:0 0 7px #00ff72;
  opacity:0;animation:particle linear infinite;
}

/* مناطق الضغط لا تغيّر الشكل */
.hit{
  position:absolute;z-index:8;display:block;
  border:0;background:transparent;cursor:pointer;
  border-radius:22px;-webkit-tap-highlight-color:transparent;
  transition:box-shadow .2s,background .2s,transform .15s;
}
.hit:hover,.hit:focus-visible{
  outline:none;background:rgba(0,255,114,.035);
  box-shadow:0 0 25px rgba(0,255,114,.28),inset 0 0 15px rgba(0,255,114,.09);
}
.hit:active{transform:scale(.985)}
.bot{left:2%;top:49.45%;width:96%;height:8.05%}
.gift{left:2%;top:58%;width:96%;height:7.95%}
.dev{left:2%;top:66.72%;width:96%;height:8%}

/* الهدية */
.modal{
  position:fixed;inset:0;z-index:50;display:none;place-items:center;
  padding:16px;background:rgba(0,0,0,.82);
}
.modal.open{display:grid;animation:fade .2s ease}
.dialog{
  position:relative;width:min(92vw,650px);padding:28px 18px 24px;
  color:#00ff72;text-align:center;background:#020603;
  border:2px solid #00ff72;
  box-shadow:0 0 12px #00ff72,0 0 55px rgba(0,255,114,.3),inset 0 0 25px rgba(0,255,114,.1);
  animation:pop .28s cubic-bezier(.2,.8,.2,1);
}
.dialog h2{margin:0 35px 18px;font-size:clamp(20px,5vw,32px)}
.dialog p{margin:0;color:#eafff1;font-size:clamp(16px,4vw,23px);line-height:1.9}
.close{
  position:absolute;left:8px;top:8px;width:40px;height:40px;
  color:#00ff72;background:#001006;border:1px solid #00ff72;
  font-size:25px;cursor:pointer
}

@keyframes wash{from{opacity:.55;transform:translate3d(-1%,0,0)}to{opacity:1;transform:translate3d(1%,0,0)}}
@keyframes scan{0%{top:-20%}100%{top:105%}}
@keyframes sweep{0%,15%{left:-35%;opacity:0}35%{opacity:1}62%{left:120%;opacity:.7}75%,100%{left:120%;opacity:0}}
@keyframes particle{
  0%{transform:translate3d(0,25px,0);opacity:0}
  12%{opacity:.55}85%{opacity:.28}
  100%{transform:translate3d(var(--x),-120px,0);opacity:0}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(14px) scale(.94)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.effects *,.dialog,.modal{animation:none!important}}
</style>
</head>
<body>
<main class="page">
  <section class="stage">
    <img src="king-reference.png" alt="KING">
    <div class="effects" aria-hidden="true">
      <div class="neon-wash"></div>
      <div class="scanline"></div>
      <div class="light-sweep"></div>
      <div class="particles" id="particles"></div>
    </div>

    <a class="hit bot" href="https://t.me/King1500hackBOT" target="_blank" rel="noopener" aria-label="بوت تلجرام مالتي"></a>
    <button class="hit gift" id="gift" aria-label="الهدية الملكية"></button>
    <a class="hit dev" href="https://t.me/FXK_I" target="_blank" rel="noopener" aria-label="تواصل مع مطور"></a>
  </section>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <section class="dialog" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="إغلاق">×</button>
    <h2>الهدية الملكية</h2>
    <p>اي اداة بايثون بالك اسوي فقط راسل مطور بوت من خلال ضغط على قسم مطور في منصة</p>
  </section>
</div>

<script>
const modal=document.getElementById('modal');
document.getElementById('gift').onclick=()=>{
  modal.classList.add('open');modal.setAttribute('aria-hidden','false');
};
document.getElementById('close').onclick=()=>{
  modal.classList.remove('open');modal.setAttribute('aria-hidden','true');
};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});

const particles=document.getElementById('particles');
for(let i=0;i<28;i++){
  const p=document.createElement('i');
  p.className='p';
  p.style.left=Math.random()*100+'%';
  p.style.top=(55+Math.random()*45)+'%';
  p.style.setProperty('--x',((Math.random()-.5)*80)+'px');
  p.style.animationDuration=(5+Math.random()*7)+'s';
  p.style.animationDelay=(-Math.random()*10)+'s';
  particles.appendChild(p);
}
</script>
</body>
</html>
