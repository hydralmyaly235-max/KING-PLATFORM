<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KING PLATFORM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#020604}
body{overflow-x:hidden;font-family:Arial,sans-serif}.page{min-height:100svh;display:flex;justify-content:center}
.stage{position:relative;width:min(100vw,900px);line-height:0;overflow:hidden;isolation:isolate;box-shadow:0 0 45px rgba(0,255,80,.16)}
.art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;position:relative;z-index:1}
.fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fx:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(0,255,95,.14) 47%,rgba(255,255,255,.08) 50%,rgba(0,255,95,.14) 53%,transparent 65%);transform:translateX(-120%);animation:sweep 4.8s ease-in-out infinite;mix-blend-mode:screen}
.fx:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,255,80,.035) 0,rgba(0,255,80,.035) 1px,transparent 1px,transparent 7px);animation:scan 2.6s linear infinite}
.p{position:absolute;width:4px;height:4px;border-radius:50%;background:#00ff66;box-shadow:0 0 8px #00ff66,0 0 18px #00ff66;opacity:.15;animation:float 3s ease-in-out infinite}
.p:nth-child(1){left:8%;top:18%}.p:nth-child(2){left:18%;top:40%;animation-delay:1.2s}.p:nth-child(3){left:31%;top:13%;animation-delay:2s}.p:nth-child(4){left:45%;top:52%;animation-delay:.7s}.p:nth-child(5){left:58%;top:25%;animation-delay:1.6s}.p:nth-child(6){left:72%;top:44%;animation-delay:2.4s}.p:nth-child(7){left:86%;top:17%;animation-delay:.9s}.p:nth-child(8){left:93%;top:62%;animation-delay:1.9s}.p:nth-child(9){left:12%;top:76%;animation-delay:2.7s}.p:nth-child(10){left:78%;top:80%;animation-delay:1.1s}.p:nth-child(11){left:52%;top:88%;animation-delay:2.2s}.p:nth-child(12){left:25%;top:91%;animation-delay:.5s}
.hotspots{position:absolute;inset:0;z-index:4}.hot{position:absolute;display:block;cursor:pointer;border:0;background:transparent;border-radius:18px;outline:none;animation:pulse 1.8s ease-in-out infinite}.hot:active{transform:scale(.985)}
.bot{left:15%;right:15%;top:50.2%;height:8.4%}.gift{left:15%;right:15%;top:62.2%;height:8.4%;animation-delay:.55s}.dev{left:15%;right:15%;top:73.9%;height:8.4%;animation-delay:1s}
.corner{position:absolute;inset:2.2%;z-index:3;pointer-events:none;border:1px solid rgba(0,255,90,.22);box-shadow:0 0 22px rgba(0,255,90,.08),inset 0 0 22px rgba(0,255,90,.05);animation:frame 2.2s ease-in-out infinite}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}
.modal.open{display:flex;animation:fade .22s ease}.box{width:min(520px,92vw);padding:28px 22px 22px;border:2px solid #00ff66;border-radius:20px;background:linear-gradient(145deg,#031108,#000);box-shadow:0 0 20px #00ff66,0 0 60px rgba(0,255,80,.35),inset 0 0 30px rgba(0,255,80,.08);color:#eafff0;text-align:center;line-height:1.7;animation:pop .35s cubic-bezier(.2,.9,.2,1)}
.box h2{margin:0 0 14px;color:#00ff66;font-size:25px}.box p{margin:0;font-size:18px}.close{margin-top:20px;border:1px solid #00ff66;border-radius:12px;padding:10px 24px;background:#031108;color:#00ff66;font-weight:700;font-size:16px}
@keyframes sweep{0%,18%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}@keyframes scan{0%{transform:translateY(-5%)}100%{transform:translateY(5%)}}@keyframes float{0%,100%{transform:translate(0,0) scale(.6);opacity:.12}50%{transform:translate(0,-22px) scale(1.5);opacity:.85}}@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(0,255,100,0)}50%{box-shadow:inset 0 0 18px rgba(0,255,100,.08),0 0 28px rgba(0,255,100,.28)}}@keyframes frame{0%,100%{opacity:.45}50%{opacity:.9}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@media(min-width:901px){.stage{width:760px}}@media(prefers-reduced-motion:reduce){.fx:before,.fx:after,.p,.hot,.corner,.box{animation:none!important}}
</style>
</head>
<body>
<main class="page"><section class="stage">
<img class="art" src="king-reference.png" alt="KING PLATFORM">
<div class="fx" aria-hidden="true">
<i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>
<i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>
</div>

<a class="hot dev" href="https://t.me/FXK_I" aria-label="تواصل مع مطور"></a>
</nav>
</section></main>
<div class="modal" id="modal" role="dialog" aria-modal="true">
<div class="box"><h2>🎁 الهدية الملكية</h2><p>اي اداة بايثون بالك اسوي فقط راسل مطور بوت من خلال ضغط على قسم مطور في منصة</p><button class="close" id="close">إغلاق</button></div>
</div>
<script>
const m=document.getElementById('modal'),g=document.getElementById('gift'),c=document.getElementById('close');
g.onclick=()=>m.classList.add('open');c.onclick=()=>m.classList.remove('open');
m.onclick=e=>{if(e.target===m)m.classList.remove('open')};
document.onkeydown=e=>{if(e.key==='Escape')m.classList.remove('open')};
</script>
</body></html>
